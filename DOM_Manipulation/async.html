<!-- Call-back -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>helloworld</h1>
</body>
<script>
    function hello(name, password) {
        setTimeout(() => {
            console.log(`Name is ${name}`);
            if (typeof name === "string") {
                password();
            } else {
                console.log("Name must be a string.");
            }
        }, 2000);
    }

    // Example Usage
    hello("John Doe", () => {
        console.log("Password function called!");
    });
</script>
</html>


<!-- Callback-hell -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Callback Hell Example</title>
</head>
<body>
    <h1>Callback Hell Example</h1>
</body>
<script>
    console.log("Start process...");

    setTimeout(() => {
        console.log("Step 1: Fetching user data...");
        setTimeout(() => {
            console.log("Step 2: Verifying user...");
            setTimeout(() => {
                console.log("Step 3: Fetching user permissions...");
                setTimeout(() => {
                    console.log("Step 4: Processing user data...");
                    setTimeout(() => {
                        console.log("Step 5: Finalizing...");
                        console.log("Process complete!");
                    }, 1000);
                }, 1000);
            }, 1000);
        }, 1000);
    }, 1000);
</script>
</html>
